name: Deploy To Render

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 깃헙 레포지토리 불러오기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        run: npm ci

      - name: 테스트용 Postgres 컨테이너 실행
        run: |
          docker run --name test-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_DB=testdb \
            -p 5433:5432 \
            -d postgres:13

      - name: 테스트용 Prisma Client 생성 및 마이그레이션
        run: |
          DATABASE_URL="postgresql://postgres:password@localhost:5433/testdb" \
          DIRECT_URL="postgresql://postgres:password@localhost:5433/testdb" \
          npx prisma generate
          DATABASE_URL="postgresql://postgres:password@localhost:5433/testdb" \
          DIRECT_URL="postgresql://postgres:password@localhost:5433/testdb" \
          npx prisma migrate deploy

      - name: 도커 임시 데이터베이스 시딩
        run: |
          DATABASE_URL="postgresql://postgres:password@localhost:5433/testdb" \
          DIRECT_URL="postgresql://postgres:password@localhost:5433/testdb" \
          npx prisma db seed

      - name: 테스트 코드 실행
        run: npm run test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Render 배포 트리거
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_DEPLOY_KEY }}" \
            | grep -q "^2" && echo "배포 트리거 성공" || (echo "배포 트리거 실패" && exit 1)
